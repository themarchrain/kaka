name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.module }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        module:
          - .
          - middleware/gin
          - middleware/http
          - examples/http-example
          - examples/gin-example
          - benchmarks
          - redis

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      REDIS_ADDR: 127.0.0.1:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work
            **/go.mod
            **/go.sum

      - name: Run tests
        working-directory: ${{ matrix.module }}
        run: go test -count=1 ./...

      - name: Run race tests
        if: matrix.module == '.'
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...

      - name: Run redis race tests
        if: matrix.module == 'redis'
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...

      - name: Run golangci-lint
        if: matrix.module != 'benchmarks'
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          working-directory: ${{ matrix.module }}
          args: --timeout=5m

      - name: Check coverage
        if: matrix.module == '.'
        run: ./scripts/check-coverage.sh
